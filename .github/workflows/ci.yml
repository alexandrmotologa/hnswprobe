name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit tests
        run: go test -v -race ./test/...

      - name: Run benchmarks
        run: go test -v -bench=. ./test/...

      - name: Build binary
        run: go build -v -o bin/hnswprobe ./cmd/hnswprobe
